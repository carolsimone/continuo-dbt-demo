# Minimal test harness for the scripts/ tooling component. Intentionally NOT a
# distributable package (no [build-system]) — these are repo CD/utility scripts;
# this file exists only so scripts/tests run standalone.
[project]
name = "scripts"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
