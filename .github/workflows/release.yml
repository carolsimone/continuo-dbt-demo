name: release

# Deploy dbt model changes through continuo's per-service release pipeline.
# Each changed service is its own independent release: build+push that service's
# image, compile+upload only its manifest to the canonical S3 key
# <service>/<release_id>/manifest.json, then POST a single-service release to
# continuo (the first run auto-bootstraps; see scripts/release.sh). The platform
# reassembles the full topology from its service_prod pointer table.
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'base/**'
      - 'dbt_upload/**'
      - 'targets.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Single service to release (e.g. service-1). Forces the matrix to just this service.'
        required: true
        type: string

# Serialize releases: continuo's release-controller has a global FIFO, but
# serializing here too keeps the per-service POSTs from racing each other.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # detect emits a JSON array of changed service names. The release job fans out
  # over it with a matrix; an empty array skips the release job entirely.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against on a push.
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch forces a single service.
            svc="${{ github.event.inputs.service }}"
            echo "manual dispatch -> service=${svc}"
            matrix=$(printf '["%s"]' "${svc}")
          else
            BEFORE="${{ github.event.before }}"
            # On the first push to a branch, github.event.before is all-zeros;
            # fall back to diffing the tip commit against its parent.
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
            echo "diff range: ${RANGE}"

            # Collect top-level service names under services/<svc>/ that changed.
            changed=$(git diff --name-only "${RANGE}" -- 'services/**' \
              | awk -F/ 'NF>=2 && $1=="services" {print $2}' \
              | sort -u)
            echo "changed service dirs:"
            echo "${changed}"

            if [ -z "${changed}" ]; then
              matrix='[]'
            else
              matrix=$(echo "${changed}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi

          echo "matrix=${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Each matrix job is one independent release; don't cancel siblings on one
      # service's failure.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.matrix) }}

    # Ephemeral Postgres for `dbt compile` (compile opens a connection but needs
    # no data — it only resolves refs/jinja into manifest.json). User/db/password
    # match the dbt profile defaults so no DBT_POSTGRES_* overrides are needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuo_svc
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: continuo_dbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release identifiers
        id: ids
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          # Per-service-unique, re-run-idempotent release id.
          echo "release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # dbt-base is the shared base layer the service images build FROM. Push
      # :latest so the per-service build resolves it from the registry.
      - name: Build and push dbt-base
        uses: docker/build-push-action@v6
        with:
          context: base
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbt-base:latest
          cache-from: type=gha,scope=dbt-base
          cache-to: type=gha,mode=max,scope=dbt-base

      - name: Build and push service image
        run: |
          svc="${{ matrix.service }}"
          docker buildx build \
            --push \
            -t "${DOCKERHUB_USERNAME}/${svc}:${{ steps.ids.outputs.tag }}" \
            -t "${DOCKERHUB_USERNAME}/${svc}:latest" \
            --cache-from "type=gha,scope=${svc}" \
            --cache-to "type=gha,mode=max,scope=${svc}" \
            "services/${svc}"

      - name: Set up Python + dbt
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # dbt is not a dbt_upload dependency (it ships in the dbt-base image); in CI
      # install both into the same interpreter so `python -m dbt_upload` (which
      # shells out to `dbt compile`) finds dbt on PATH.
      - name: Install dbt + dbt_upload
        run: |
          pip install --no-cache-dir "dbt-core==1.12.0b1" "dbt-postgres==1.10.0"
          pip install --no-cache-dir -e .

      # Compile + upload ONLY this service. The positional service dir uploads
      # just that one manifest to the canonical key
      # <service>/<release_id>/manifest.json. The image tag travels in the POST
      # body (below), not in S3 — so no service_metadata sidecar.
      - name: Compile + upload manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
          DBT_POSTGRES_HOST: localhost
        run: |
          python -m dbt_upload load \
            "services/${{ matrix.service }}" \
            --target hetzner \
            --release-id "${{ steps.ids.outputs.release_id }}"

      - name: Configure SSH for continuo-server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Drive the release through continuo
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          RELEASE_ID: ${{ steps.ids.outputs.release_id }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.ids.outputs.tag }}
        run: bash scripts/release.sh
