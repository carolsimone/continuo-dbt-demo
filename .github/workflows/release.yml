name: release

# Deploy a dbt model change through continuo's blue/green pipeline:
# build+push the per-service images, then POST a release to continuo
# (the first run auto-bootstraps; see scripts/release.sh).
# dbt compile + manifest upload now happen inside continuo itself.
#
# Manual dispatch releases a named service at the current main HEAD, and can
# force a bootstrap (promote without validation, re-baselining the whole
# estate's content hashes) — needed after continuo changes its hash formula,
# when every stored hash mismatches and a normal release would validate the
# entire topology.
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      service:
        description: "Service to release (a services/<name> directory)"
        required: true
        type: string
      force_bootstrap:
        description: "Promote without validation and re-baseline the whole estate's content hashes"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Decide whether this push is releasable and which service it targets. Kept as
  # its own job so a no-op push (CI/tooling/base only — no service changed) skips
  # the release job cleanly via `if:` instead of failing partway through.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.ids.outputs.skip }}
      skip_release: ${{ steps.ids.outputs.skip_release }}
      service: ${{ steps.ids.outputs.service }}
      kind: ${{ steps.ids.outputs.kind }}
      image_tag: ${{ steps.ids.outputs.image_tag }}
      tag: ${{ steps.ids.outputs.tag }}
      release_id: ${{ steps.ids.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff this push against the previous main tip and
          # identify which service changed.
          fetch-depth: 0

      - name: Compute release identifiers + changed service
        id: ids
        run: |
          SHA="$(git rev-parse --short HEAD)"

          # A manually dispatched run names its target service explicitly —
          # required for a forced bootstrap, where no service directory has
          # changed. A push release derives the service from the diff below.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ inputs.service }}"
            if [ ! -d "services/${SERVICE}" ]; then
              echo "::error::unknown service '${SERVICE}' — no services/${SERVICE}/ directory"; exit 1
            fi
            # A service is python iff it declares contracts/ (a python-node
            # service directory); every other service is a dbt project.
            if [ -d "services/${SERVICE}/contracts" ]; then KIND="python"; else KIND="dbt"; fi
            echo "Dispatched release: ${SERVICE} @ ${SHA} (kind=${KIND}, force_bootstrap=${{ inputs.force_bootstrap }})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
            echo "release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # continuo models a release as a SINGLE changed service: POST /releases
          # takes one {service, image_tag} and the controller reconstructs the
          # rest of the set from the live service_prod pointers. So we diff this
          # push and require exactly one services/<svc>/ to have changed.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BEFORE" ]; then
            echo "::error::cannot determine previous commit to diff against"; exit 1
          fi

          CHANGED="$(git diff --name-only "$BEFORE" HEAD -- 'services/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          # More than one service is ambiguous under the single-service contract.
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed service per release; found ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          # No service changed → nothing to release; skip the release job.
          if [ "$COUNT" -eq 0 ]; then
            echo "No service change in this push — nothing to do; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exactly one service changed → normal single-service release.
          SERVICE="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
          # A service is python iff it declares contracts/ (a python-node
          # service directory); every other service is a dbt project.
          if [ -d "services/${SERVICE}/contracts" ]; then KIND="python"; else KIND="dbt"; fi
          echo "Changed service: ${SERVICE} @ ${SHA} (kind=${KIND})"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Backstop against a wedged step (e.g. a stuck SSH/poll) idling for GitHub's
    # 6-hour default. The budget covers the arm64 half of the image build, which
    # runs under QEMU emulation and is several times slower than the native
    # amd64 half, plus release.sh's own ~9-minute poll ceiling.
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the changed-service diff resolves.
          fetch-depth: 0

      # A python-node service (services/<svc>/contracts/) goes through the
      # continuo-python-runtime CLI before the image build: lint the scripts,
      # validate the contracts against the install's warehouse dialect, then
      # merge them into the wire artifact continuo's manifest side recomputes
      # hashes against. dbt services skip all of this — their compile leg
      # runs inside continuo itself.
      - name: Set up uv
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install continuo-python-runtime
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: |
          uv tool install continuo-python-runtime || \
            uv tool install "git+https://github.com/carolsimone/continuo-python-runtime"

      # Fast feedback only: this only looks at the service's scripts/. `continuo-runtime
      # merge` (below) independently lints the script plus its whole in-repo import
      # closure, so a helper outside scripts/ is still covered.
      - name: Lint python scripts (no hand-written SQL)
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: continuo-runtime lint "services/${{ needs.detect.outputs.service }}/scripts"

      # --dialect postgres checks each declared read against the install's own
      # warehouse dialect, not just sqlglot's dialect-neutral grammar.
      - name: Validate python contracts
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: continuo-runtime validate "services/${{ needs.detect.outputs.service }}/contracts" --dialect postgres

      # --repo-root is the SERVICE's own directory, not the monorepo root: each
      # python-node service is a self-contained project the same way a dbt
      # service is, and repo-root is what the in-repo import closure (folded
      # into shared_code_hash) resolves against.
      - name: Merge python contracts
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: |
          continuo-runtime merge "services/${{ needs.detect.outputs.service }}/contracts" \
            --service "${{ needs.detect.outputs.service }}" \
            --repo-root "services/${{ needs.detect.outputs.service }}" \
            --out "${RUNNER_TEMP}/contract.yaml"

      # Registers the QEMU binfmt handlers that let this amd64 runner execute
      # arm64 binaries, which is what the linux/arm64 half of the image build
      # below needs to run pip inside the base image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the changed service gets a new image at this commit's tag; the
      # other services keep their current prod image tags (the controller reuses
      # them via the service_prod pointers), so there is nothing to rebuild.
      #
      # Both platforms are built because the cluster pulling these images decides
      # the architecture, and a single-platform image is simply unpullable
      # elsewhere: an arm64 node rejects an amd64-only manifest list outright
      # ("no matching manifest for linux/arm64"). Apple Silicon laptops running a
      # local kind cluster are the common case that hits this.
      - name: Build and push the changed service image
        if: needs.detect.outputs.skip_release != 'true'
        run: |
          svc="${{ needs.detect.outputs.service }}"
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            -t "${DOCKERHUB_USERNAME}/${svc}:${{ needs.detect.outputs.tag }}" \
            -t "${DOCKERHUB_USERNAME}/${svc}:latest" \
            --cache-from "type=gha,scope=${svc}" \
            --cache-to "type=gha,mode=max,scope=${svc}" \
            "services/${svc}"

      # continuo runs a python-kind image_tag verbatim — nothing is composed
      # on its side the way the bare short sha is for a dbt release — so this
      # must be the full pullable registry ref, not just the tag the build
      # step above already pushed under.
      - name: Compose full image ref for python release
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: |
          echo "PYTHON_IMAGE_TAG=docker.io/${DOCKERHUB_USERNAME}/${{ needs.detect.outputs.service }}:${{ needs.detect.outputs.tag }}" >> "$GITHUB_ENV"

      # The boundary contract requires this upload to complete before the
      # POST below: continuo does no existence check, so a POST racing its
      # own upload fails at the parsing stage. Endpoint/bucket/region match
      # this repo's own pre-Plan-5 manifest uploads (dbt-loader/targets.yaml,
      # target "hetzner") — the same Hetzner object-storage account continuo's
      # own S3-compatible install still points at.
      - name: Upload contract.yaml to S3
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "${RUNNER_TEMP}/contract.yaml" \
            "s3://continuo-dev/${{ needs.detect.outputs.service }}/${{ needs.detect.outputs.release_id }}/contract.yaml" \
            --endpoint-url https://nbg1.your-objectstorage.com \
            --region eu-central-1

      - name: Configure SSH for continuo-server
        if: needs.detect.outputs.skip_release != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Drive the release through continuo
        if: needs.detect.outputs.skip_release != 'true'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          RELEASE_ID: ${{ needs.detect.outputs.release_id }}
          SERVICE: ${{ needs.detect.outputs.service }}
          # dbt keeps the bare short sha continuo composes into a pull ref
          # itself; python carries the full ref composed above, since
          # continuo runs a python image_tag verbatim.
          IMAGE_TAG: ${{ needs.detect.outputs.kind == 'python' && env.PYTHON_IMAGE_TAG || needs.detect.outputs.image_tag }}
          KIND: ${{ needs.detect.outputs.kind }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          # Renders 'false' on push events, where inputs is empty.
          FORCE_BOOTSTRAP: ${{ inputs.force_bootstrap == true }}
        run: bash scripts/release.sh
