name: release

# Deploy a dbt model change through continuo's blue/green pipeline:
# build+push the per-service images, compile+upload the manifests to S3, then
# POST a release to continuo (the first run auto-bootstraps; see scripts/release.sh).
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'dbt-loader/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Decide whether this push is releasable and which service it targets. Kept as
  # its own job so a no-op push (CI/tooling/base only — no service changed) skips
  # the release job cleanly via `if:` instead of failing partway through.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.ids.outputs.skip }}
      skip_release: ${{ steps.ids.outputs.skip_release }}
      service: ${{ steps.ids.outputs.service }}
      image_tag: ${{ steps.ids.outputs.image_tag }}
      tag: ${{ steps.ids.outputs.tag }}
      release_id: ${{ steps.ids.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff this push against the previous main tip and
          # identify which service changed.
          fetch-depth: 0

      - name: Compute release identifiers + changed service
        id: ids
        run: |
          SHA="$(git rev-parse --short HEAD)"

          # continuo models a release as a SINGLE changed service: POST /releases
          # takes one {service, image_tag} and the controller reconstructs the
          # rest of the set from the live service_prod pointers. So we diff this
          # push and require exactly one services/<svc>/ to have changed.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BEFORE" ]; then
            echo "::error::cannot determine previous commit to diff against"; exit 1
          fi

          CHANGED="$(git diff --name-only "$BEFORE" HEAD -- 'services/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          # More than one service is ambiguous under the single-service contract.
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed service per release; found ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          # No service changed → nothing to release; skip the release job.
          if [ "$COUNT" -eq 0 ]; then
            echo "No service change in this push — nothing to do; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exactly one service changed → normal single-service release.
          SERVICE="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
          echo "Changed service: ${SERVICE} @ ${SHA}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Backstop: the deploy is a fast POST + a short poll. If anything wedges
    # (e.g. a stuck SSH/poll), fail fast instead of idling for GitHub's 6-hour
    # default.
    timeout-minutes: 10
    permissions:
      contents: read

    # Ephemeral Postgres for `dbt compile` (compile opens a connection but needs
    # no data — it only resolves refs/jinja into manifest.json). User/db/password
    # match the dbt profile defaults so no DBT_POSTGRES_* overrides are needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuo_svc
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: continuo_dbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the changed-service diff resolves.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the changed service gets a new image at this commit's tag; the
      # other services keep their current prod image tags (the controller reuses
      # them via the service_prod pointers), so there is nothing to rebuild.
      - name: Build and push the changed service image
        if: needs.detect.outputs.skip_release != 'true'
        run: |
          svc="${{ needs.detect.outputs.service }}"
          docker buildx build \
            --push \
            -t "${DOCKERHUB_USERNAME}/${svc}:${{ needs.detect.outputs.tag }}" \
            -t "${DOCKERHUB_USERNAME}/${svc}:latest" \
            --cache-from "type=gha,scope=${svc}" \
            --cache-to "type=gha,mode=max,scope=${svc}" \
            "services/${svc}"

      - name: Set up Python + dbt
        if: needs.detect.outputs.skip_release != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # dbt is not a dbt_load dependency; install it alongside dbt_load so python -m dbt_load (which shells out to dbt compile) finds dbt on PATH.
      - name: Install dbt + dbt_load
        if: needs.detect.outputs.skip_release != 'true'
        run: |
          pip install --no-cache-dir "dbt-core==1.12.0b1" "dbt-postgres==1.10.0"
          pip install --no-cache-dir -e ./dbt-loader

      # Compile the changed service (against the ephemeral Postgres) and upload
      # its manifest to the Hetzner object store at the canonical key
      # <service>/<release_id>/manifest.json (continuo's CanonicalManifestKey).
      # The image tag travels in the POST body (below), not in S3 — so no
      # service_metadata sidecar. Other services' manifests are already in S3
      # from their own releases; the controller reuses them via service_prod.
      - name: Compile + upload manifest
        if: needs.detect.outputs.skip_release != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
          DBT_POSTGRES_HOST: localhost
        run: |
          python -m dbt_load load \
            "services/${{ needs.detect.outputs.service }}" \
            --target hetzner \
            --release-id "${{ needs.detect.outputs.release_id }}"

      - name: Configure SSH for continuo-server
        if: needs.detect.outputs.skip_release != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Drive the release through continuo
        if: needs.detect.outputs.skip_release != 'true'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          RELEASE_ID: ${{ needs.detect.outputs.release_id }}
          SERVICE: ${{ needs.detect.outputs.service }}
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/release.sh
