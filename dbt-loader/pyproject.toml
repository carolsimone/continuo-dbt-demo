[project]
name = "dbt-loader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # validation_runner imports psycopg2 at module scope (it materializes the
    # candidate node via psycopg2); its emission unit tests patch psycopg2.connect,
    # so the binary wheel must be importable in the test env (no DB connection opened).
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
only-include = ["dbt_load"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
