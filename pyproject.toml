# Minimal test harness for the leftover scripts/ tests that have not yet
# been carved into their own component (Phase D). The dbt_load library has its
# own packaging under dbt-loader/. This file is intentionally NOT a distributable
# package — it only provides pythonpath + test deps so `tests/` keeps running.
[project]
name = "continuo-dbt-demo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
