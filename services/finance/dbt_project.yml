name: finance
version: '1.0.1'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

seeds:
  finance:
    # A seed is a full snapshot of its CSV, not an append/incremental target,
    # so it should always be rebuilt from scratch -- see services/core/dbt_project.yml
    # for why +full_refresh: false is the wrong default (it silently blocks
    # any future column change from landing).
    +full_refresh: true
    +meta:
      owner: "finance"
      criticality: "CORE"

models:
  finance:
    +materialized: table
    +meta:
      owner: "finance"
      criticality: "CORE"
