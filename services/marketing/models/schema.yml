version: 2

models:
  - name: marketing_spend_monthly
    description: "Marketing spend rolled up to one row per channel per month. Source of the channel-month totals that marketing_cost_per_user divides across acquired users. All amounts are EUR."
    columns:
      - name: channel
        description: "Paid acquisition channel. Only the five channels we spend on appear here; organic and referral never do."
        tests:
          - not_null
      - name: spend_month
        description: "First day of the calendar month the spend falls in."
        tests:
          - not_null
      - name: spend_eur
        description: "Total spend for the channel that month, in EUR, rounded to cents."
        tests:
          - not_null
      - name: campaign_count
        description: "Number of campaign-level seed rows rolled into this channel-month."
        tests:
          - not_null
      - name: impressions
        description: "Total ad impressions served across the channel's campaigns that month."
        tests:
          - not_null
      - name: clicks
        description: "Total ad clicks across the channel's campaigns that month."
        tests:
          - not_null

  - name: marketing_cost_per_user
    description: "Per-user marketing acquisition cost: each channel-month's spend divided evenly across the users that channel acquired that month. One row per user. Organic and referral users cost 0 (unpaid by nature, not unknown). Spend in a channel-month that acquired nobody is unallocated and absent here, so the total is less than marketing_spend_monthly's total. Per-user costs within a cohort can sum a few cents off that cohort's spend due to rounding."
    columns:
      - name: user_id
        description: "Matches core.seed_users.user_id and finance's transaction user ids."
        tests:
          - unique
          - not_null
      - name: channel
        description: "Channel that acquired the user, including unpaid ones (organic, referral)."
        tests:
          - not_null
      - name: campaign
        description: "Campaign that acquired the user. Descriptive only — allocation happens at channel grain, not campaign grain."
      - name: acquired_at
        description: "Exact timestamp the user was acquired, before truncation to acquisition_month."
        tests:
          - not_null
      - name: acquisition_month
        description: "First day of the month the user was acquired; the month whose spend is divided."
        tests:
          - not_null
      - name: channel_is_paid
        description: "True iff the channel appears in marketing_spend_monthly. Distinguishes a 0 that means 'unpaid channel' (false) from a 0 that means 'paid channel with no spend that month' (true)."
        tests:
          - not_null
      - name: marketing_cost_eur
        description: "The user's share of their channel's spend in their acquisition month, in EUR. Zero for unpaid channels; never NULL, never negative."
        tests:
          - not_null

seeds:
  - name: seed_marketing_spend
    description: "Campaign-level marketing spend, one row per campaign per month, 2021-01 to 2023-12. Generated by scripts/gen_marketing_spend.py — edit that script, not this CSV."
    columns:
      - name: spend_id
        tests:
          - unique
          - not_null
      - name: channel
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
      - name: currency
        description: "Always EUR. The accepted_values test pins the no-conversion assumption in marketing_spend_monthly."
        tests:
          - not_null
          - accepted_values:
              values: ['EUR']
