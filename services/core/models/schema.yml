version: 2

models:
  - name: daily_transactions
    description: "Basic union of core card transactions and finance FX transactions, valued in EUR. transaction_id is not unique across sources; use `source` to disambiguate."
    columns:
      - name: transaction_id
        description: "Source-local transaction id (not unique across sources)."
        tests:
          - not_null
      - name: amount_eur
        description: "Transaction value in EUR. Card amounts are treated as already-EUR; FX amounts come pre-converted from fx_transactions_eur."
        tests:
          - not_null
      - name: fee_amount_eur
        description: "Revenue: the fee the company earned on this transaction, in EUR. Card fees are already EUR; FX fees come pre-converted from fx_transactions_eur."
        tests:
          - not_null
      - name: source
        description: "Origin of the row: 'card' (seed_card_transactions) or 'fx' (analytics.fx_transactions_eur)."
        tests:
          - not_null

  - name: revenue_per_user
    description: "Per-user realized revenue over the observation window: the fees the company earned, not the volume the customer moved. One row per user; users with no transactions carry revenue_eur 0. Input to finance's ltv_per_user."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: acquisition_month
        tests:
          - not_null
      - name: revenue_eur
        description: "Sum of fee_amount_eur across this user's transactions. Zero for users with none."
        tests:
          - not_null
      - name: gross_volume_eur
        description: "Sum of amount_eur. Carried beside revenue_eur so the volume/revenue distinction stays visible."
        tests:
          - not_null
