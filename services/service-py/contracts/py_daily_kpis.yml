nodes:
  # First python node in the demo estate: a daily rollup of core's
  # daily_transactions table. The read below is the cross-service DAG edge —
  # analytics.daily_transactions is produced by the core service's dbt project.
  - schema: analytics
    table: py_daily_kpis
    description: "Daily transaction count and total EUR amount, rolled up from analytics.daily_transactions."
    owner: "service-py"
    schedule: daily
    criticality: SECONDARY
    script: scripts/py_daily_kpis.py
    # One entry, named `daily`. The script never writes SQL itself — it groups
    # the rows this read returns. Raw (unaggregated) columns are selected here
    # on purpose so the aggregation logic lives in Python, not in the read.
    reads:
      daily: select created_at, amount_eur from analytics.daily_transactions
    output_columns:
      - {name: day, type: DATE, nullable: false}
      - {name: tx_count, type: INTEGER, nullable: false}
      - {name: total_amount, type: "NUMERIC(12,2)", nullable: false}
