# Minimal test harness for the dbt-base runtime component. Intentionally NOT a
# distributable package (no [build-system]) — dbt-base is a Docker image; this
# package exists only so its validation tests can import dbt_base.*.
[project]
name = "dbt-base"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34.0"]

[project.optional-dependencies]
dev = [
    # validation_runner/seed_validation_runner import psycopg2 at module scope;
    # tests patch psycopg2.connect, so the binary wheel must be importable.
    "pytest>=8.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
